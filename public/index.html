<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse — Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="app-logo">
      <span class="logo-pulse"></span>
      <span class="logo-name">Pulse</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" title="Настройки" id="themeToggle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      </button>
      <button class="icon-btn" title="Новый чат">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" class="search-input" placeholder="Поиск по чатам..." />
  </div>

  <nav class="chat-list" id="chatList">
    <div class="chat-item active" data-chat="general">
      <div class="chat-avatar" style="--hue:210">
        <span>G</span>
        <span class="online-dot"></span>
      </div>
      <div class="chat-info">
        <div class="chat-top">
          <span class="chat-name">Общий чат</span>
          <span class="chat-time" id="generalTime">сейчас</span>
        </div>
        <div class="chat-bottom">
          <span class="chat-preview" id="generalPreview">Добро пожаловать!</span>
          <span class="chat-badge hidden" id="generalBadge">0</span>
        </div>
      </div>
    </div>

    <div class="chat-item" data-chat="saved">
      <div class="chat-avatar saved-avatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
      </div>
      <div class="chat-info">
        <div class="chat-top">
          <span class="chat-name">Избранное</span>
          <span class="chat-time">—</span>
        </div>
        <div class="chat-bottom">
          <span class="chat-preview">Сохранённые сообщения</span>
        </div>
      </div>
    </div>
  </nav>
</aside>

<!-- MAIN CHAT AREA -->
<main class="chat-area">

  <!-- CHAT HEADER -->
  <header class="chat-header">
    <button class="icon-btn sidebar-toggle" id="sidebarToggle">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="chat-header-info">
      <div class="chat-header-avatar" style="--hue:210">G</div>
      <div>
        <div class="chat-header-name">Общий чат</div>
        <div class="chat-header-status" id="onlineCount">1 участник онлайн</div>
      </div>
    </div>
    <div class="chat-header-actions">
      <button class="icon-btn" title="Поиск в чате">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="icon-btn" title="Видеозвонок">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>
      <button class="icon-btn" title="Ещё">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </button>
      <button class="icon-btn" title="Личный профиль" id="profileBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
    </div>
  </header>

  <!-- MESSAGES -->
  <div class="messages-wrap" id="messagesWrap">
    <div class="messages-list" id="messagesList">
      <div class="day-divider"><span>Сегодня</span></div>
      <div class="welcome-msg">
        <div class="welcome-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <p>Добро пожаловать в <strong>Pulse</strong> — начните общение прямо сейчас.</p>
      </div>
    </div>
  </div>

  <!-- MEDIA PREVIEW -->
  <div class="media-preview-bar hidden" id="mediaPreviewBar">
    <div class="media-preview-inner">
      <div class="media-preview-thumb" id="mediaPreviewThumb"></div>
      <div class="media-preview-info">
        <span class="media-preview-name" id="mediaPreviewName">файл.jpg</span>
        <span class="media-preview-size" id="mediaPreviewSize">—</span>
      </div>
      <button class="media-remove-btn" id="mediaRemoveBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- INPUT AREA -->
  <div class="input-area">
    <div class="input-wrap">
      <label class="icon-btn attach-btn" title="Прикрепить файл">
        <input type="file" id="fileInput" accept="image/*,video/*,.pdf,.doc,.docx,.txt" hidden />
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </label>

      <div class="textarea-wrap">
        <textarea
          id="messageInput"
          class="message-input"
          placeholder="Напишите сообщение..."
          rows="1"
          maxlength="2000"
        ></textarea>
      </div>

      <button class="icon-btn emoji-btn" title="Эмодзи" id="emojiToggle" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      </button>

      <button class="icon-btn" id="voiceBtn" title="Голосовое сообщение" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
      </button>

      <button class="icon-btn" id="circleBtn" title="Записать кружок" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
      </button>

      <button class="send-btn" id="sendBtn" title="Отправить">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>

    <div class="input-meta">
      <span class="username-wrap">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="usernameInput" class="username-input" value="Гость" maxlength="30" />
      </span>
      <span class="char-count" id="charCount">0 / 2000</span>
    </div>
  </div>

</main>

<!-- LIGHTBOX -->
<div class="lightbox hidden" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="lightbox-content" id="lightboxContent"></div>
</div>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- EMOJI PICKER -->
<div class="emoji-picker hidden" id="emojiPicker"></div>

<!-- PROFILE MODAL -->
<div class="profile-modal hidden" id="profileModal">
  <div class="profile-card">
    <h3>Личный профиль</h3>
    <label class="profile-field">
      <span>Имя</span>
      <input type="text" id="profileName" maxlength="30" />
    </label>
    <label class="profile-field">
      <span>Статус</span>
      <input type="text" id="profileStatus" maxlength="60" placeholder="Например: На связи" />
    </label>
    <label class="profile-field">
      <span>О себе</span>
      <textarea id="profileBio" maxlength="160" rows="3" placeholder="Коротко о себе"></textarea>
    </label>
    <div class="profile-actions">
      <button id="profileCancel" class="profile-btn ghost" type="button">Отмена</button>
      <button id="profileSave" class="profile-btn primary" type="button">Сохранить</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
